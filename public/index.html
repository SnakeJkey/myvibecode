<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Game Radar: события и обновления в играх</title>
    <meta name="description" content="Текущие и предстоящие события, версии и обновления в Arknights: Endfield, World of Tanks, Minecraft и Hearts of Iron IV." />
    <meta name="color-scheme" content="light dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236c5ce7'/%3E%3Ccircle cx='32' cy='32' r='6' fill='white'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='white' stroke-width='4' opacity='.7'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='white' stroke-width='3' opacity='.4'/%3E%3C/svg%3E" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('theme'); } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#" aria-label="Game Radar">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22"><circle cx="16" cy="16" r="3" fill="currentColor"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".75"/><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" opacity=".4"/></svg>
          </span>
          <span class="brand__text">Game Radar</span>
        </a>
        <div class="topbar__actions">
          <span class="updated" id="updated" aria-live="polite"></span>
          <button class="icon-btn" id="refresh" type="button" title="Обновить данные" aria-label="Обновить данные">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
          </button>
          <button class="icon-btn" id="theme" type="button" title="Переключить тему" aria-label="Переключить тему" aria-pressed="false">
            <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </div>
      <nav class="games" id="games" role="tablist" aria-label="Игры"></nav>
    </header>

    <main class="page">
      <div class="toolbar">
        <div class="segmented" id="sections" role="tablist" aria-label="Раздел">
          <button type="button" role="tab" data-section="current">
            <span class="segmented__dot segmented__dot--live"></span>Текущая версия
          </button>
          <button type="button" role="tab" data-section="upcoming">
            <span class="segmented__dot"></span>Предстоящая
          </button>
          <span class="segmented__thumb" aria-hidden="true"></span>
        </div>
        <div class="play" id="play" hidden></div>
      </div>

      <div id="content" aria-live="polite"></div>
    </main>

    <footer class="footer" id="footer"></footer>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop"></div>
      <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal__close icon-btn" id="modal-close" type="button" aria-label="Закрыть" title="Закрыть (Esc)">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="modal__scroll"></div>
      </div>
    </div>
    <script src="format.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
